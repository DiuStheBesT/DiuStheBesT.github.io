<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kirill Papilio | Art Director & VFX Supervisor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400&family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
    
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #e5f2fb;
            font-family: 'Inter', sans-serif;
            color: #343434;
            text-align: center;
        }

        .container {
            max-width: 800px; /* Трохи ширше, щоб titles вміщалися в рядок */
            padding: 40px 20px;
        }

        h1 {
            font-family: 'Montserrat', sans-serif;
            font-weight: 800; /* Extra Bold, як у 1-му варіанті */
            /* Збільшив розмір, щоб вирівняти по ширині з Titles. */
            font-size: clamp(2.3rem, 9.5vw, 3.2rem); 
            /* Збільшив трекінг, щоб заповнити ширину без занадто великих літер */
            letter-spacing: 0.1em;
            /* Повернув великий інтервал */
            margin-bottom: 1.5rem;
            text-transform: uppercase;
            color: #1a1a1a;
            display: inline-block;
        }

        .titles {
            font-weight: 400;
            font-size: 1.3rem; /* Трохи більший розмір, як у 1-му варіанті */
            color: #343434;
            /* Повернув великий інтервал */
            margin-bottom: 2.5rem;
            letter-spacing: 0.02em;
        }

        .industries {
            font-weight: 300;
            font-size: 0.9rem; /* Трохи більший розмір */
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: #999;
            /* Повернув великий інтервал */
            margin-bottom: 4rem;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: center;
        }

        a {
            color: #620902;
            text-decoration: none;
            font-weight: 400;
            font-size: 0.95rem;
            border-bottom: 1px solid transparent;
            transition: all 0.3s ease;
        }

        a:hover {
            color: #1a1a1a;
            border-bottom: 1px solid #620902;
        }

        .location {
            margin-top: 4.5rem;
            font-size: 0.85rem;
            color: #999;
            font-weight: 400;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Kirill Papilio</h1>
        <div class="titles">Art Director | Cinematic Director | VFX Supervisor</div>
        <div class="industries">Film · Games · Immersive Media</div>
        
        <div class="links">
            <a href="mailto:kirillpapilio@gmail.com">kirillpapilio@gmail.com</a>
            <a href="https://www.artstation.com/kirillpapilio" target="_blank">ArtStation Portfolio</a>
            <a href="https://www.linkedin.com/in/kirillpapilio/" target="_blank">LinkedIn Profile</a>
        </div>

        <div class="location">Kyiv, Ukraine</div>
    </div>
</body>
</html>
