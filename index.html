<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kirill Papilio | Art Director</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400&family=Montserrat:wght@800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #e5f2fb;
            --text-main: #1a1a1a;
            --text-secondary: #343434;
            --text-muted: #999999;
            --accent: #620902;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: var(--bg-color);
            font-family: 'Inter', -apple-system, sans-serif;
            -webkit-font-smoothing: antialiased;
            color: var(--text-main);
            text-align: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
            padding: 60px 24px;
        }

        /* ГАЙД: H1 має бути значно більшим за Body (Scale 2.5x - 3x) */
        h1 {
            font-family: 'Montserrat', sans-serif;
            font-weight: 800;
            font-size: clamp(2.5rem, 10vw, 4rem); 
            letter-spacing: -0.02em; /* Зменшив трекінг для кращої читаємості великого шрифту */
            line-height: 1.1;
            margin: 0 0 16px 0; /* 16px - стандартний відступ */
            text-transform: uppercase;
        }

        /* ГАЙД: Subtitle (Medium size, Regular weight) */
        .titles {
            font-weight: 400;
            font-size: clamp(1rem, 4vw, 1.25rem);
            color: var(--text-secondary);
            margin-bottom: 8px; /* Ближче до заголовка, бо вони — одна група */
            letter-spacing: 0.01em;
        }

        /* ГАЙД: Overline/Caption (Small, Uppercase, Wide spacing) */
        .industries {
            font-weight: 300;
            font-size: 0.8rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 64px; /* Великий відступ перед наступною секцією (Links) */
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 16px;
            align-items: center;
        }

        a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 400;
            font-size: 1rem;
            padding: 4px 0;
            border-bottom: 1px solid transparent;
            transition: all 0.2s ease-in-out;
        }

        a:hover {
            color: var(--text-main);
            border-bottom: 1px solid var(--accent);
        }

        .location {
            margin-top: 80px;
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 400;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Kirill Papilio</h1>
        <div class="titles">Art Director | Cinematic Director | VFX Supervisor</div>
        <div class="industries">Film · Games · Immersive Media</div>
        
        <div class="links">
            <a href="mailto:kirillpapilio@gmail.com">kirillpapilio@gmail.com</a>
            <a href="https://www.artstation.com/kirillpapilio" target="_blank">ArtStation Portfolio</a>
            <a href="https://www.linkedin.com/in/kirillpapilio/" target="_blank">LinkedIn Profile</a>
        </div>

        <div class="location">Kyiv, Ukraine</div>
    </div>
</body>
</html>
